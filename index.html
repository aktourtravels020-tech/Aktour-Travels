<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#eff6ff" />
  <title>World Clock</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background: #eff6ff;
      color: #172554;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 48px 20px;
      background:
        radial-gradient(ellipse at top, #dbeafe 0, transparent 55%),
        #eff6ff;
    }

    main {
      width: min(100%, 1000px);
      margin: 0 auto;
    }

    header {
      margin-bottom: 32px;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #2563eb;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 3.25rem);
      letter-spacing: -0.05em;
    }

    .intro {
      margin: 12px 0 0;
      color: #64748b;
    }

    .clock-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
      gap: 16px;
    }

    .clock-card {
      padding: 24px;
      border: 1px solid #dbeafe;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 12px 30px rgba(30, 64, 175, 0.07);
    }

    .city {
      margin: 0;
      color: #1e3a8a;
      font-size: 1rem;
      font-weight: 700;
    }

    .zone {
      margin: 4px 0 18px;
      color: #64748b;
      font-size: 0.85rem;
    }

    .time {
      font-variant-numeric: tabular-nums;
      font-size: clamp(2.2rem, 8vw, 3rem);
      font-weight: 750;
      letter-spacing: -0.06em;
      line-height: 1.1;
      white-space: nowrap;
    }

    .date {
      margin: 10px 0 0;
      color: #64748b;
      font-size: 0.9rem;
    }

    footer {
      margin-top: 24px;
      color: #64748b;
      font-size: 0.85rem;
      text-align: center;
    }

    @media (max-width: 480px) {
      body {
        padding: 32px 16px;
      }

      .clock-card {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Time around the world</p>
      <h1>World Clock</h1>
      <p class="intro">The current time, wherever you need it.</p>
    </header>

    <section class="clock-grid" id="clocks" aria-label="Current time in different time zones"></section>
    <footer>Times update automatically.</footer>
  </main>

  <script>
    const timeZones = [
      { city: "Your Local Time", zone: Intl.DateTimeFormat().resolvedOptions().timeZone },
      { city: "Darbhanga, India", zone: "Asia/Kolkata" },
      { city: "London, United Kingdom", zone: "Europe/London" },
      { city: "New York, United States", zone: "America/New_York" },
      { city: "Tokyo, Japan", zone: "Asia/Tokyo" },
      { city: "Sydney, Australia", zone: "Australia/Sydney" }
    ];

    const clocks = document.getElementById("clocks");

    timeZones.forEach(({ city, zone }, index) => {
      const card = document.createElement("article");
      card.className = "clock-card";
      card.innerHTML = `
        <h2 class="city">${city}</h2>
        <p class="zone">${zone}</p>
        <div class="time" id="time-${index}" role="timer" aria-live="off">--:--:--</div>
        <p class="date" id="date-${index}">Loading date…</p>
      `;
      clocks.appendChild(card);
    });

    function updateClocks() {
      const now = new Date();

      timeZones.forEach(({ zone }, index) => {
        document.getElementById(`time-${index}`).textContent =
          new Intl.DateTimeFormat("en-GB", {
            timeZone: zone,
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hourCycle: "h23"
          }).format(now);

        document.getElementById(`date-${index}`).textContent =
          new Intl.DateTimeFormat("en", {
            timeZone: zone,
            weekday: "long",
            year: "numeric",
            month: "long",
            day: "numeric"
          }).format(now);
      });
    }

    updateClocks();
    setInterval(updateClocks, 1000);
  </script>
</body>
</html>
